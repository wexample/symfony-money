services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    _instanceof:
        Wexample\SymfonyForms\Service\FormProcessor\AbstractFormProcessor:
            tags: ['wexample.symfony_forms.form_processor']

    Wexample\SymfonyMoney\:
        resource: '../../{Form,Repository,Service}'

    Wexample\SymfonyMoney\Api\Controller\:
        resource: '../../Api/Controller/*'
        tags: ['controller.service_arguments']

    Wexample\SymfonyMoney\Api\Normalizer\:
        resource: '../../Api/Normalizer/*'
        tags: ['serializer.normalizer']
